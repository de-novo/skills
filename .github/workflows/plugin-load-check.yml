name: Plugin loads

# Installs the plugin from this checkout into a scratch CLAUDE_CONFIG_DIR and
# fails unless it reaches "enabled". Schema validation alone misses load-layer
# breakage; this catches it before a person does.
on:
  pull_request:
    paths:
      - .claude-plugin/**
      - skills/**
      - .github/workflows/plugin-load-check.yml
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate the manifests
        run: claude plugin validate . --strict
      - name: Install the plugin from this checkout into a scratch config
        run: |
          export CLAUDE_CONFIG_DIR="$RUNNER_TEMP/claude-scratch"
          mkdir -p "$CLAUDE_CONFIG_DIR"
          claude plugin marketplace add "$GITHUB_WORKSPACE"
          claude plugin install de-novo-skills@de-novo
          claude plugin list | tee plugin-list.txt
          grep -q "enabled" plugin-list.txt || {
            echo "::error::plugin failed to load; see claude plugin list output above"
            exit 1
          }
      - name: Every published skill is in the manifest, and nothing else
        run: |
          expected=$(ls -d skills/*/ | sed 's|^|./|; s|/$||' | sort)
          actual=$(node -p "require('./.claude-plugin/plugin.json').skills.sort().join('\n')")
          diff <(echo "$expected") <(echo "$actual") && echo "skills $(echo "$actual" | wc -l | tr -d ' ')/$(echo "$expected" | wc -l | tr -d ' ')"

name: Verify

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  test:
    # Linux is the baseline; macOS is where the catalog is used day to day,
    # so its worktree paths, resolver, and pseudo-terminals are run too.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - run: npm test
      - name: Check shell syntax
        run: bash -n infra/bin/provision
      - name: Validate the compose catalog
        if: runner.os == 'Linux'
        run: docker compose -f infra/docker-compose.yml --profile '*' config --quiet
      - name: Look before anything runs
        run: node infra/bin/cli.mjs doctor --json > /dev/null && node infra/bin/cli.mjs herbarium check
      - name: Validate published examples
        run: |
          passed=0
          total=0
          for profile in skills/grove/examples/*.runtime-profile.yml; do
            total=$((total + 1))
            node infra/bin/cli.mjs validate "$profile"
            passed=$((passed + 1))
          done
          echo "profiles ${passed}/${total}"

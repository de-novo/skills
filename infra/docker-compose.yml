# Machine-shared infra — engines every project on this machine uses.
# Projects do not start these engines again in their own compose.
#
# One engine on the machine, so ports stay standard. Isolate inside the
# engine (database, account, prefix) — see infra/README.md.
# Bind 127.0.0.1 only — local-dev credentials, do not expose.
#
# Catalog of engines. Engine id = the compose profile. ground.* labels are
# how the CLI learns provision and aliases — do not keep a second name list.
# Bare `docker compose up` starts none. `setup` / `up <name>` start what you ask.
name: dev-infra

services:
  mysql8:
    image: mysql:8.4
    container_name: dev-mysql8
    profiles: [mysql]
    labels:
      ground.provision: mysql
      ground.port: "3306"
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql8:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 12

  pg16:
    image: postgres:16
    container_name: dev-pg16
    profiles: [pg]
    labels:
      ground.provision: pg
      ground.aliases: postgres,postgresql
      ground.port: "5432"
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      - pg16:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis7:
    image: redis:7
    container_name: dev-redis7
    profiles: [redis]
    labels:
      ground.port: "6379"
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis7:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  kafka:
    image: apache/kafka:3.9.0
    container_name: dev-kafka
    profiles: [kafka]
    labels:
      ground.port: "19092"
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      # Host clients use localhost:9092; containers on the dev-infra
      # network use dev-kafka:19092.
      KAFKA_LISTENERS: INTERNAL://:19092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://dev-kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka:/var/lib/kafka/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s

  mongo7:
    image: mongo:7
    container_name: dev-mongo7
    profiles: [mongo]
    labels:
      ground.port: "27017"
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo7:/data/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand({ ping: 1 }).ok ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s

  mailpit:
    image: axllent/mailpit
    container_name: dev-mailpit
    profiles: [mail]
    labels:
      ground.aliases: mailpit
      ground.port: "1025"
    ports:
      - "127.0.0.1:1025:1025" # SMTP
      - "127.0.0.1:8025:8025" # Web UI
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 12

  minio:
    image: minio/minio
    container_name: dev-minio
    profiles: [minio]
    labels:
      ground.aliases: s3
      ground.port: "9000"
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
      MC_HOST_local: http://minio:minio123@localhost:9000
    volumes:
      - minio:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s

volumes:
  mysql8:
  pg16:
  redis7:
  kafka:
  mongo7:
  minio:

networks:
  # Project compose containers that need infra join this network as
  # external. Host processes use localhost:<port>.
  default:
    name: dev-infra
